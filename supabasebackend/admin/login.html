<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEFA Soweto Admin Login</title>
    <style>
        body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#020617;
}

#login-screen{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

#login-box{
    background:#0f172a;
    border:2px solid gold;
    border-radius:15px;
    padding:35px;
    width:100%;
    max-width:380px;
    text-align:center;
    box-shadow:0 0 25px rgba(255,215,0,.25);
}

#login-box img{
    margin-bottom:15px;
}

#login-box h2{
    color:gold;
    margin-bottom:5px;
}

#login-box p{
    color:white;
}

#login-box input{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

#login-box button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:gold;
    color:black;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

#login-box button:hover{
    background:#facc15;
}

#login-error{
    color:#ff6b6b;
    margin-top:15px;
}

    </style>

    <link rel="stylesheet" href="css/login.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <!-- Your Supabase Configuration -->
    <script src="../supabase.js"></script>
</head>

<body>

<div id="login-screen">

    <div id="login-box">

        <img src="../MASINDE GOLD.png" width="90" alt="Logo">

        <h2>Admin Login</h2>

        <p>PEFA Soweto Cathedral</p>

        <input
            type="email"
            id="email"
            placeholder="Admin Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="login-btn">
            Login
        </button>

        <p id="login-error"></p>

    </div>

</div>

</body>
</html>
